name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Queue the release PR to merge itself once the required checks pass.
      - name: Enable auto-merge on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open release PR to auto-merge."
            exit 0
          fi
          echo "Enabling auto-merge on PR #$pr"
          gh pr merge "$pr" --auto --merge --repo "$GITHUB_REPOSITORY"

  # A release created with GITHUB_TOKEN does not emit a `release` event that
  # other workflows can hear, so publish is invoked directly instead.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
