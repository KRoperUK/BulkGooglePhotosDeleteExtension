name: Publish to Chrome Web Store

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v1.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No tag to publish"
            exit 1
          fi
          echo "Publishing tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Check credentials are configured
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in CWS_EXTENSION_ID CWS_PUBLISHER_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit $missing

      - name: Verify tag matches manifest version
        run: |
          set -euo pipefail
          version=$(node -p 'require("./manifest.json").version')
          # Tags may be "v1.1.0" or "<package-name>-v1.1.0"; extract the trailing semver.
          tag_version=$(echo "${{ steps.tag.outputs.tag }}" | sed -E 's/^.*v([0-9]+(\.[0-9]+){0,3})$/\1/')
          echo "tag=${{ steps.tag.outputs.tag }} -> $tag_version, manifest=$version"
          if [ "$tag_version" != "$version" ]; then
            echo "::error::Release tag ($tag_version) does not match manifest.json version ($version)"
            exit 1
          fi

      # Merge commits and their inner commits share a message, so Release Please
      # lists each change twice. Collapse them to one line per message.
      - name: Collapse duplicate entries in the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f tools/dedupe-release-notes.py ]; then
            echo "No dedupe script at this tag — skipping."
            exit 0
          fi
          gh release view "$TAG" --json body --jq .body > /tmp/notes.md
          python3 tools/dedupe-release-notes.py /tmp/notes.md > /tmp/notes-deduped.md
          if cmp -s /tmp/notes.md /tmp/notes-deduped.md; then
            echo "No duplicate entries."
          else
            gh release edit "$TAG" --notes-file /tmp/notes-deduped.md
            echo "Collapsed duplicate entries."
          fi

      - name: Build extension zip
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/extension.zip manifest.json content.js background.js sidepanel.html sidepanel.js icons -x '*.DS_Store'
          unzip -l dist/extension.zip

      # Assets are attached before the store upload so a release still carries
      # them when publishing is blocked, e.g. while a previous version is in review.
      - name: Assemble release assets
        run: |
          set -euo pipefail
          version=$(node -p 'require("./manifest.json").version')
          cp dist/extension.zip "dist/bulk-delete-google-photos-${version}.zip"
          git archive --format=zip \
            --prefix="bulk-delete-google-photos-${version}/" \
            -o "dist/bulk-delete-google-photos-${version}-source.zip" HEAD
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -lh dist

      - name: Attach assets to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber

      - name: Upload and publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # v7.0.0
        with:
          file-path: dist/extension.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          publisher-id: ${{ secrets.CWS_PUBLISHER_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true

      # The upload action exits 0 even when the store ignores the publish call,
      # so confirm independently that the store now reports this version.
      - name: Confirm the store accepted the package
        env:
          EXT_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./manifest.json").version')

          resp=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")

          token=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::Token exchange failed: $(echo "$resp" | jq -r '.error_description // .error')"
            exit 1
          fi
          echo "::add-mask::$token"

          item=""
          for attempt in 1 2 3 4 5 6; do
            item=$(curl -sS -H "Authorization: Bearer ${token}" \
              "https://www.googleapis.com/chromewebstore/v1.1/items/${EXT_ID}?projection=DRAFT")
            crx=$(echo "$item" | jq -r '.crxVersion // empty')
            echo "attempt ${attempt}: store reports crxVersion=${crx:-none}, expected ${version}"
            if [ "$crx" = "$version" ]; then
              echo "$item" | jq 'del(.publicKey)'
              echo "Store accepted version ${version}."
              exit 0
            fi
            sleep 10
          done

          echo "::error::Store does not report version ${version} after upload - the publish was silently ignored."
          echo "$item" | jq 'del(.publicKey)' || echo "$item"
          exit 1
