name: Publish to Chrome Web Store

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check credentials are configured
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in CWS_EXTENSION_ID CWS_PUBLISHER_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit $missing

      - name: Verify release tag matches manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p 'require("./manifest.json").version')
          echo "tag=$tag manifest=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag ($tag) does not match manifest.json version ($version)"
            exit 1
          fi

      - name: Build extension zip
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/extension.zip manifest.json content.js icons -x '*.DS_Store'
          unzip -l dist/extension.zip

      - name: Upload and publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # v7.0.0
        with:
          file-path: dist/extension.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          publisher-id: ${{ secrets.CWS_PUBLISHER_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true
