name: Feature request
description: Suggest a new capability or an improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The extension deliberately stays dependency-free,
        makes no network requests, and keeps permissions minimal — proposals
        that fit those constraints are easiest to accept.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point, not just the solution.
      placeholder: I want to skip photos before a certain date.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the extension do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Fit with the project's constraints
      options:
        - label: This needs no new permissions beyond activeTab / scripting / sidePanel.
          required: false
        - label: This needs no network requests or third-party services.
          required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
